---
version: "2"

linters:
    default: all

    disable:
        - cyclop
        - err113
        - exhaustruct
        - funcorder
        - funlen
        - gocognit
        - gocyclo
        - godox
        - ireturn
        - maintidx
        - mnd
        - nestif
        - nilnil
        - nlreturn
        - noinlineerr
        - paralleltest
        - recvcheck
        - revive
        - testpackage
        - varnamelen
        - whitespace
        - wrapcheck
        - wsl
        - wsl_v5

    settings:
        depguard:
            rules:
                main:
                    list-mode: strict
                    allow:
                        - $gostd
                        - github.com/charmbracelet/
                        - gitlab.com/allddd/

    exclusions:
        rules:
            - path: _test\.go
              linters:
                  - errcheck
                  - goconst
                  - gosec
