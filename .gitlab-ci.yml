---
default:
    image: golang:1-trixie
    interruptible: true

stages:
    - lint
    - test
    - build
    - publish

.go-cache:
    variables:
        GOPATH: $CI_PROJECT_DIR/.go
    before_script:
        - mkdir -p .go
    cache:
        key:
            files:
                - go.sum
        paths:
            - .go/pkg/mod/

lint:
    stage: lint
    image: golangci/golangci-lint:latest
    script:
        - golangci-lint fmt -d
        - golangci-lint run

test:
    stage: test
    extends: .go-cache
    script:
        - go run github.com/bobg/mingo/cmd/mingo@latest -v -check -tests
        - make test

build:
    stage: build
    extends: .go-cache
    script:
        - make VERSION="${CI_COMMIT_TAG:-$CI_PIPELINE_ID}" build-release
    artifacts:
        paths:
            - $CI_PROJECT_NAME
        expire_in: 1 day

publish:
    stage: publish
    image: registry.gitlab.com/gitlab-org/cli:latest
    interruptible: false
    rules:
        - if: $CI_COMMIT_TAG
    script:
        - apk add --no-cache curl
        - |
            curl -sSL --fail-with-body \
                 -T "./$CI_PROJECT_NAME" \
                 -H "JOB-TOKEN: $CI_JOB_TOKEN" \
                 "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/$CI_PROJECT_NAME"
    release:
        tag_name: $CI_COMMIT_TAG
        description: N/A
        assets:
            links:
                - name: "$CI_PROJECT_NAME"
                  link_type: "other"
                  url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/$CI_PROJECT_NAME"
                - name: "$CI_PROJECT_NAME.sha256"
                  link_type: "other"
                  url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/$CI_PROJECT_NAME.sha256"
